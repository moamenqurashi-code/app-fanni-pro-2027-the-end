name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project & Add Packages
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter url_launcher
          flutter pub add --dev flutter_launcher_icons

      - name: Configure Separate Icon & Full Splash Image
        run: |
          cd app_project
          mkdir -p assets

          # 1. نسخ صورة الدخول splash.png داخل مجلد assets لتظهر كاملة بدون قص
          if [ -f "../splash.png" ]; then
            cp ../splash.png assets/splash.png
          elif [ -f "../icon.png" ]; then
            cp ../icon.png assets/splash.png
          fi

          # تفعيل مجلد assets في pubspec.yaml
          sed -i 's/# assets:/assets:\n    - assets\/splash.png/g' pubspec.yaml

          # 2. إعداد أيقونة التطبيق الخارجية فقط من ملف icon.png
          if [ -f "../icon.png" ]; then
            cp ../icon.png icon.png
            cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Prepare Signing Key
        run: |
          if [ -f "my-key.jks" ]; then
            echo "Using existing my-key.jks..."
            cp my-key.jks app_project/android/app/upload-keystore.jks
          else
            cd app_project/android/app
            keytool -genkeypair -v \
              -keystore upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass FaniPro2026 \
              -keypass FaniPro2026 \
              -dname "CN=Fanni Pro, OU=Dev, O=FanniPro, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Configure AndroidManifest & Gradle Signing
        run: |
          cd app_project

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                  </intent>
              </queries>

              <application
                  android:label="فني برو"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          sed -i 's/versionCode flutterVersionCode.toInteger()/versionCode 11/g' android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.1.0"/g' android/app/build.gradle

          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file("upload-keystore.jks")\n            storePassword "FaniPro2026"\n            keyAlias "upload"\n            keyPassword "FaniPro2026"\n        }\n    }' android/app/build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle

      - name: Write Optimized Flutter WebView Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: FaniProScreen(),
            ));
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isFirstLoad = true;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF1B3B7B))
                ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {
                      if (progress > 75 && _isLoading) {
                        setState(() {
                          _isLoading = false;
                          _isFirstLoad = false;
                        });
                      }
                    },
                    onPageStarted: (String url) => setState(() => _isLoading = true),
                    onPageFinished: (String url) {
                      setState(() {
                        _isLoading = false;
                        _isFirstLoad = false;
                      });

                      _controller.runJavaScript('''
                        (function() {
                          var style = document.createElement('style');
                          style.innerHTML = '* { -webkit-tap-highlight-color: transparent; } input, textarea { scroll-margin-bottom: 150px; }';
                          document.head.appendChild(style);

                          document.addEventListener('focusin', function(e) {
                            var tag = e.target.tagName;
                            if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) {
                              setTimeout(function() {
                                e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }, 300);
                            }
                          });
                        })();
                      ''');
                    },
                    onNavigationRequest: (NavigationRequest request) async {
                      final String url = request.url;
                      final String lowerUrl = url.toLowerCase();
                      final Uri uri = Uri.parse(url);

                      if (lowerUrl.startsWith('intent://')) {
                        try {
                          final RegExp schemeReg = RegExp(r'scheme=([a-zA-Z0-9]+);');
                          final match = schemeReg.firstMatch(url);
                          if (match != null) {
                            final String scheme = match.group(1)!;
                            final String convertedUrl = url
                                .replaceFirst('intent://', '$scheme://')
                                .split('#Intent')[0];
                            await launchUrl(Uri.parse(convertedUrl), mode: LaunchMode.externalApplication);
                            return NavigationDecision.prevent;
                          }
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (!['http', 'https'].contains(uri.scheme) ||
                          lowerUrl.contains('wa.me/') ||
                          lowerUrl.contains('api.whatsapp.com') ||
                          lowerUrl.contains('whatsapp.com/send') ||
                          lowerUrl.contains('chat.whatsapp.com') ||
                          lowerUrl.contains('t.me/')) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (e) {
                          debugPrint('Error launching URL: $e');
                        }
                        return NavigationDecision.prevent;
                      }

                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://hrinnf.blogspot.com/'));
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (didPop) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  }
                },
                child: Scaffold(
                  resizeToAvoidBottomInset: true,
                  backgroundColor: const Color(0xFF1B3B7B),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        
                        // شاشة الدخول الكاملة (تظهر عند فتح التطبيق بدون أي قص للصورة)
                        if (_isFirstLoad)
                           Positioned.fill(
                            child: Container(
                              color: const Color(0xFF1B3B7B),
                              child: Stack(
                                fit: StackFit.expand,
                                children: [
                                  Image.asset(
                                    'assets/splash.png',
                                    fit: BoxFit.cover, // لو عايز الصورة تظهر كاملة حتى لو أبعادها مختلفة وميتقصش من الجناب خليها BoxFit.contain
                                  ),
                                  const Positioned(
                                    bottom: 50,
                                    left: 0,
                                    right: 0,
                                    child: Center(
                                      child: CircularProgressIndicator(
                                        color: Colors.white,
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          )
                        else if (_isLoading)
                          const Center(
                            child: CircularProgressIndicator(
                              color: Colors.white,
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Signed AAB and APK
        run: |
          cd app_project
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload App Bundles
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
