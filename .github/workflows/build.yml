name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project & Add Packages
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter webview_flutter_android url_launcher
          flutter pub add --dev flutter_launcher_icons

      - name: Configure App Icon & Full Splash Image
        run: |
          cd app_project
          mkdir -p assets

          if [ -f "../splash.png" ]; then
            cp ../splash.png assets/splash.png
          elif [ -f "../icon.png" ]; then
            cp ../icon.png assets/splash.png
          fi

          sed -i 's/# assets:/assets:\n    - assets\/splash.png/g' pubspec.yaml

          if [ -f "../icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            cp ../icon.png icon.png
            cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "icon.png"
            min_sdk_android: 24
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Prepare Signing Key
        run: |
          if [ -f "my-key.jks" ]; then
            echo "Using existing my-key.jks..."
            cp my-key.jks app_project/android/app/upload-keystore.jks
          else
            cd app_project/android/app
            keytool -genkeypair -v \
              -keystore upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass FaniPro2026 \
              -keypass FaniPro2026 \
              -dname "CN=Fanni Pro, OU=Dev, O=FanniPro, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Configure AndroidManifest & Speed Tweaks
        run: |
          cd app_project

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                  </intent>
              </queries>

              <application
                  android:label="فني برو"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle

          sed -i 's/versionCode flutterVersionCode.toInteger()/versionCode 11/g' android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.1.0"/g' android/app/build.gradle

          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            storeFile file("upload-keystore.jks")\n            storePassword "FaniPro2026"\n            keyAlias "upload"\n            keyPassword "FaniPro2026"\n        }\n    }' android/app/build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle

      - name: Write High Performance Flutter WebView Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: FaniProScreen(),
            ));
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isSplashVisible = true;
            double _loadingProgress = 0.0;

            @override
            void initState() {
              super.initState();

              // تثبيت شاشة الدخول لمدة ثانيتين بالضبط
              Future.delayed(const Duration(seconds: 2), () {
                if (mounted && _isSplashVisible) {
                  setState(() {
                    _isSplashVisible = false;
                  });
                }
              });

              final PlatformWebViewControllerCreationParams params =
                  const PlatformWebViewControllerCreationParams();

              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              // تفعيل إعدادات تسريع التصفح والكاش على أندرويد
              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                (controller.platform as AndroidWebViewController)
                  ..setMediaPlaybackRequiresUserGesture(false);
              }

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF1B3B7B))
                ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {
                      setState(() {
                        _loadingProgress = progress / 100;
                      });
                    },
                    onPageFinished: (String url) {
                      // كود جافاسكريبت متطور لحل مشكلة تغطية الكيبورد للسطور وتسريع اللمس
                      controller.runJavaScript('''
                        (function() {
                          // إلغاء تأخير النقرات 300ms
                          var meta = document.querySelector('meta[name="viewport"]');
                          if (meta) {
                            meta.content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no";
                          }

                          // حل مشكلة تغطية حقول الإدخال عند ظهور لوحة المفاتيح
                          function handleFocus(e) {
                            var target = e.target;
                            if (['INPUT', 'TEXTAREA'].includes(target.tagName) || target.isContentEditable) {
                              setTimeout(function() {
                                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }, 350);
                            }
                          }

                          document.removeEventListener('focusin', handleFocus);
                          document.addEventListener('focusin', handleFocus);

                          // مراقبة الـ Viewport عند فتح الكيبورد في أندرويد الحديث
                          if (window.visualViewport) {
                            window.visualViewport.addEventListener('resize', function() {
                              var active = document.activeElement;
                              if (active && (['INPUT', 'TEXTAREA'].includes(active.tagName) || active.isContentEditable)) {
                                active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }
                            });
                          }
                        })();
                      ''');
                    },
                    onNavigationRequest: (NavigationRequest request) async {
                      final String url = request.url;
                      final String lower = url.toLowerCase();
                      final Uri uri = Uri.parse(url);

                      if (lower.startsWith('intent://')) {
                        try {
                          final RegExp reg = RegExp(r'scheme=([a-zA-Z0-9]+);');
                          final match = reg.firstMatch(url);
                          if (match != null) {
                            final String scheme = match.group(1)!;
                            final String converted = url
                                .replaceFirst('intent://', '\$scheme://')
                                .split('#Intent')[0];
                            await launchUrl(Uri.parse(converted), mode: LaunchMode.externalApplication);
                            return NavigationDecision.prevent;
                          }
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (!['http', 'https'].contains(uri.scheme) ||
                          lower.contains('wa.me/') ||
                          lower.contains('api.whatsapp.com') ||
                          lower.contains('whatsapp.com/send') ||
                          lower.contains('chat.whatsapp.com') ||
                          lower.contains('t.me/')) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://hrinnf.blogspot.com/'));

              _controller = controller;
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (didPop) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  }
                },
                child: Scaffold(
                  // ضروري جداً لكي تتقلص شاشة الويب فيو تلقائياً مع حجم لوحة المفاتيح
                  resizeToAvoidBottomInset: true,
                  backgroundColor: const Color(0xFF1B3B7B),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),

                        // مؤشر تحميل خفيف وسريع في أعلى الصفحة بدلاً من الدائرة التي تعطل الحركة
                        if (_loadingProgress < 1.0 && !_isSplashVisible)
                          LinearProgressIndicator(
                            value: _loadingProgress,
                            backgroundColor: Colors.transparent,
                            valueColor: const AlwaysStoppedAnimation<Color>(Colors.amber),
                            minHeight: 2.5,
                          ),

                        // شاشة الدخول: تختفي تماماً من شجرة الرسوم (Tree) بمجرد التحميل لتفريغ الرام
                        if (_isSplashVisible)
                          Positioned.fill(
                            child: Container(
                              color: const Color(0xFF1B3B7B),
                              child: Stack(
                                fit: StackFit.expand,
                                children: [
                                  Image.asset(
                                    'assets/splash.png',
                                    fit: BoxFit.cover,
                                  ),
                                  const Positioned(
                                    bottom: 60,
                                    left: 0,
                                    right: 0,
                                    child: Center(
                                      child: CircularProgressIndicator(
                                        color: Colors.white,
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Signed AAB and APK
        run: |
          cd app_project
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload App Bundles
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
