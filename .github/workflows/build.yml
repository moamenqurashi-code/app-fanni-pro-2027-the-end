name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK for 16KB Page Size
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Flutter (Supports 16KB Page Alignment)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Flutter Project & Add Packages
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter webview_flutter_android url_launcher image_picker "permission_handler:^11.3.1" "permission_handler_android:12.1.0" upgrader google_mobile_ads connectivity_plus flutter_tts

      - name: Configure App Icon & High-Res Splash Image
        run: |
          cd "$GITHUB_WORKSPACE/app_project"
          mkdir -p assets

          if [ -f "$GITHUB_WORKSPACE/splash.png" ]; then
            cp "$GITHUB_WORKSPACE/splash.png" assets/splash.png
          elif [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/icon.png" assets/splash.png
          fi

          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/icon.png" assets/icon.png
          else
            cp assets/splash.png assets/icon.png
          fi

          sed -i 's/# assets:/assets:\n    - assets\/splash.png\n    - assets\/icon.png/g' pubspec.yaml

          python3 - << 'PYEOF'
          import os, shutil

          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          custom_icon = os.path.join(workspace, "icon.png")
          if not os.path.exists(custom_icon):
              custom_icon = os.path.join(workspace, "splash.png")

          anydpi_dir = "android/app/src/main/res/mipmap-anydpi-v26"
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)

          for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              p = os.path.join("android/app/src/main/res", folder)
              os.makedirs(p, exist_ok=True)
              target_file = os.path.join(p, "ic_launcher.png")
              if os.path.exists(custom_icon):
                  shutil.copy(custom_icon, target_file)
          PYEOF

      - name: Prepare Signing Key & Verify Alias
        run: |
          KEY_PATH=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \( -name "my-key.jks" -o -name "*.jks" \) | head -n 1)

          if [ -z "$KEY_PATH" ]; then
            echo "ERROR: my-key.jks not found in repository!"
            exit 1
          fi

          cp "$KEY_PATH" "$GITHUB_WORKSPACE/app_project/android/app/upload-keystore.jks"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/app_project/android/app/upload-keystore.jks" -storepass FaniPro2026

      - name: Configure AndroidManifest, AdMob, Audio, 16KB Page Size & Signing
        run: |
          cd "$GITHUB_WORKSPACE/app_project"

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:label="فني برو"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:requestLegacyExternalStorage="true"
                  android:extractNativeLibs="false"
                  android:hardwareAccelerated="true">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-4314198432903878~9275491183"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          ACTUAL_ALIAS=$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass FaniPro2026 | grep "Alias name:" | head -n 1 | awk '{print $3}')
          if [ -z "$ACTUAL_ALIAS" ]; then
            ACTUAL_ALIAS="upload"
          fi

          cat << EOF > android/key.properties
          storePassword=FaniPro2026
          keyPassword=FaniPro2026
          keyAlias=$ACTUAL_ALIAS
          storeFile=upload-keystore.jks
          EOF

          for f in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.9.1"/g' "$f"
              sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.9.1"/g' "$f"
              sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' "$f"
              sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' "$f"
            fi
          done

          sed -i 's/gradle-.*-all.zip/gradle-8.11.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

          rm -f android/app/build.gradle.kts
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace "com.pro.ap4016842.skn"
              compileSdk 36
              ndkVersion "27.0.12077973"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.pro.ap4016842.skn"
                  minSdkVersion 24
                  targetSdkVersion 36
                  versionCode 17
                  versionName "1.6.0"
                  multiDexEnabled true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = false
                  }
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

      - name: Write High Performance Flutter WebView Code
        run: |
          cat << 'EOF' > "$GITHUB_WORKSPACE/app_project/lib/main.dart"
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:upgrader/upgrader.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:flutter_tts/flutter_tts.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await MobileAds.instance.initialize();
            runApp(
              MaterialApp(
                debugShowCheckedModeBanner: false,
                builder: (context, child) {
                  return MediaQuery(
                    data: MediaQuery.of(context).copyWith(
                      textScaler: const TextScaler.linear(1.0),
                    ),
                    child: child!,
                  );
                },
                home: const FaniProScreen(),
              ),
            );
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isSplashTimerDone = false;
            bool _isPageLoaded = false;
            bool _hasInternet = true;
            bool _hasWebError = false;
            double _loadingProgress = 0.0;
            String _lastUrl = 'https://hrinnf.blogspot.com/';
            DateTime? _lastBackPressed;

            StreamSubscription<List<ConnectivityResult>>? _connectivitySub;

            // معرفات AdMob
            static const String _bannerAdUnitId = 'ca-app-pub-4314198432903878/9000159015';
            static const String _interstitialAdUnitId = 'ca-app-pub-4314198432903878/1173639886';
            static const String _rewardedAdUnitId = 'ca-app-pub-4314198432903878/4841422157';

            BannerAd? _bannerAd;
            bool _isBannerLoaded = false;

            InterstitialAd? _interstitialAd;
            int _pageNavigationCount = 0;
            DateTime _lastInterstitialTime = DateTime.now().subtract(const Duration(minutes: 2));

            RewardedAd? _rewardedAd;
            String _pendingRewardAction = '';

            // محرك الصوت لمرشد فني برو (FanniTTS)
            final FlutterTts _flutterTts = FlutterTts();

            @override
            void initState() {
              super.initState();
              _requestAppPermissions();
              _initAudioEngine();
              _initAds();
              _initWebView();
              _startSplashAndNetworkGuard();
            }

            Future<void> _requestAppPermissions() async {
              try {
                await [Permission.notification].request();
              } catch (_) {}
            }

            Future<void> _initAudioEngine() async {
              try {
                await _flutterTts.setLanguage("ar-EG");
                await _flutterTts.setSpeechRate(0.52);
                await _flutterTts.setVolume(1.0);
                await _flutterTts.setPitch(1.0);

                _flutterTts.setCompletionHandler(() {
                  _controller.runJavaScript('''
                    if (typeof window.onFanniTTSDone === 'function') {
                      window.onFanniTTSDone();
                    }
                  ''');
                });
              } catch (_) {}
            }

            void _initAds() {
              _loadBannerAd();
              _loadInterstitialAd();
              _loadRewardedAd();
            }

            void _loadBannerAd() {
              _bannerAd = BannerAd(
                adUnitId: _bannerAdUnitId,
                size: AdSize.banner,
                request: const AdRequest(),
                listener: BannerAdListener(
                  onAdLoaded: (ad) {
                    if (mounted) {
                      setState(() {
                        _isBannerLoaded = true;
                      });
                    }
                  },
                  onAdFailedToLoad: (ad, error) {
                    ad.dispose();
                    if (mounted) {
                      setState(() {
                        _isBannerLoaded = false;
                      });
                    }
                    Future.delayed(const Duration(seconds: 30), () {
                      if (mounted) _loadBannerAd();
                    });
                  },
                ),
              )..load();
            }

            void _loadInterstitialAd() {
              InterstitialAd.load(
                adUnitId: _interstitialAdUnitId,
                request: const AdRequest(),
                adLoadCallback: InterstitialAdLoadCallback(
                  onAdLoaded: (ad) {
                    _interstitialAd = ad;
                    _interstitialAd?.setImmersiveMode(true);
                  },
                  onAdFailedToLoad: (error) {
                    _interstitialAd = null;
                  },
                ),
              );
            }

            void _maybeShowInterstitialAd() {
              _pageNavigationCount++;
              final secondsSinceLastAd = DateTime.now().difference(_lastInterstitialTime).inSeconds;

              if (_pageNavigationCount >= 4 && secondsSinceLastAd >= 60 && _interstitialAd != null) {
                _pageNavigationCount = 0;
                _lastInterstitialTime = DateTime.now();
                _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _loadInterstitialAd();
                  },
                  onAdFailedToShowFullScreenContent: (ad, error) {
                    ad.dispose();
                    _loadInterstitialAd();
                  },
                );
                _interstitialAd!.show();
                _interstitialAd = null;
              } else if (_interstitialAd == null) {
                _loadInterstitialAd();
              }
            }

            void _loadRewardedAd() {
              RewardedAd.load(
                adUnitId: _rewardedAdUnitId,
                request: const AdRequest(),
                rewardedAdLoadCallback: RewardedAdLoadCallback(
                  onAdLoaded: (ad) {
                    _rewardedAd = ad;
                    _rewardedAd?.setImmersiveMode(true);
                  },
                  onAdFailedToLoad: (error) {
                    _rewardedAd = null;
                  },
                ),
              );
            }

            void _showRewardedAd(String rewardCallbackData) {
              _pendingRewardAction = rewardCallbackData;
              if (_rewardedAd != null) {
                bool rewardEarned = false;
                _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _loadRewardedAd();
                    if (rewardEarned) {
                      _notifyWebRewardEarned(_pendingRewardAction);
                    }
                  },
                  onAdFailedToShowFullScreenContent: (ad, error) {
                    ad.dispose();
                    _loadRewardedAd();
                    _notifyWebRewardEarned(_pendingRewardAction);
                  },
                );
                _rewardedAd!.show(
                  onUserEarnedReward: (AdWithoutView ad, RewardItem reward) {
                    rewardEarned = true;
                  },
                );
                _rewardedAd = null;
              } else {
                _loadRewardedAd();
                _notifyWebRewardEarned(_pendingRewardAction);
              }
            }

            void _notifyWebRewardEarned(String actionData) {
              final safeData = jsonEncode(actionData);
              _controller.runJavaScript('''
                if (typeof window.onFaniProRewardEarned === 'function') {
                  window.onFaniProRewardEarned($safeData);
                }
              ''');
            }

            void _startSplashAndNetworkGuard() {
              Future.delayed(const Duration(milliseconds: 1200), () {
                if (mounted) {
                  setState(() {
                    _isSplashTimerDone = true;
                  });
                }
              });

              _checkInitialConnectivity();
              _connectivitySub = Connectivity().onConnectivityChanged.listen((results) {
                final bool connected = results.any((r) => r != ConnectivityResult.none);
                _handleConnectionChange(connected);
              });
            }

            Future<void> _checkInitialConnectivity() async {
              final results = await Connectivity().checkConnectivity();
              final bool connected = results.any((r) => r != ConnectivityResult.none);
              _handleConnectionChange(connected);
            }

            void _handleConnectionChange(bool connected) {
              if (!mounted) return;
              if (connected) {
                if (!_hasInternet || _hasWebError) {
                  setState(() {
                    _hasInternet = true;
                    _hasWebError = false;
                  });
                  _controller.loadRequest(Uri.parse(_lastUrl));
                }
              } else {
                if (_hasInternet) {
                  setState(() {
                    _hasInternet = false;
                  });
                }
              }
            }

            void _initWebView() {
              const PlatformWebViewControllerCreationParams params =
                  PlatformWebViewControllerCreationParams();

              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                final androidController =
                    controller.platform as AndroidWebViewController;
                androidController.setMediaPlaybackRequiresUserGesture(false);
                androidController.setTextZoom(100);

                androidController.setOnShowFileSelector((FileSelectorParams params) async {
                  try {
                    final ImagePicker picker = ImagePicker();
                    final XFile? image = await picker.pickImage(
                      source: ImageSource.gallery,
                      imageQuality: 80,
                    );
                    if (image != null) {
                      return [File(image.path).uri.toString()];
                    }
                  } catch (_) {}
                  return [];
                });
              }

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF1B3B7B))
                ..setUserAgent(
                    'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..addJavaScriptChannel(
                  'FanniTTS',
                  onMessageReceived: (JavaScriptMessage message) async {
                    final String text = message.message.trim();
                    if (text == '__STOP__') {
                      await _flutterTts.stop();
                    } else if (text.isNotEmpty) {
                      await _flutterTts.stop();
                      await _flutterTts.speak(text);
                    }
                  },
                )
                ..addJavaScriptChannel(
                  'FaniProBridge',
                  onMessageReceived: (JavaScriptMessage message) async {
                    try {
                      final data = jsonDecode(message.message);
                      final String action = data['action'] ?? '';
                      if (action == 'show_reward_ad') {
                        _showRewardedAd(data['target'] ?? '');
                      } else if (action == 'show_interstitial') {
                        _maybeShowInterstitialAd();
                      }
                    } catch (_) {}
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {
                      if (mounted) {
                        setState(() {
                          _loadingProgress = progress / 100;
                        });
                      }
                    },
                    onPageStarted: (String url) {
                      _flutterTts.stop();
                      if (url.startsWith('http')) {
                        if (_lastUrl != url) {
                          _maybeShowInterstitialAd();
                        }
                        _lastUrl = url;
                      }
                    },
                    onPageFinished: (String url) {
                      if (mounted && !_hasWebError) {
                        setState(() {
                          _isPageLoaded = true;
                        });
                      }

                      controller.runJavaScript('''
                        (function() {
                          var meta = document.querySelector('meta[name="viewport"]');
                          if (meta) {
                            meta.content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no";
                          }
                          document.documentElement.style.webkitTextSizeAdjust = '100%';

                          var closeBtn = document.querySelector('.mascot-toast-close');
                          if (closeBtn && !closeBtn.dataset.ttsHooked) {
                            closeBtn.dataset.ttsHooked = '1';
                            closeBtn.addEventListener('click', function() {
                              if (window.FanniTTS) window.FanniTTS.postMessage('__STOP__');
                            });
                          }

                          function handleFocus(e) {
                            var target = e.target;
                            if (['INPUT', 'TEXTAREA'].includes(target.tagName) || target.isContentEditable) {
                              setTimeout(function() {
                                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }, 350);
                            }
                          }

                          document.removeEventListener('focusin', handleFocus);
                          document.addEventListener('focusin', handleFocus);
                        })();
                      ''');
                    },
                    onWebResourceError: (WebResourceError error) {
                      if (error.isForMainFrame ?? true) {
                        if (mounted) {
                          setState(() {
                            _hasWebError = true;
                            _isPageLoaded = false;
                          });
                        }
                      }
                    },
                    onNavigationRequest: (NavigationRequest request) async {
                      final String url = request.url;
                      final String lower = url.toLowerCase();
                      final Uri uri = Uri.parse(url);

                      final bool isDownloadFile = lower.endsWith('.pdf') ||
                          lower.endsWith('.doc') ||
                          lower.endsWith('.docx') ||
                          lower.endsWith('.zip') ||
                          lower.endsWith('.rar') ||
                          lower.endsWith('.apk') ||
                          lower.contains('drive.google.com/uc?') ||
                          lower.contains('drive.usercontent.google.com/download') ||
                          lower.contains('mediafire.com/file/');

                      if (isDownloadFile) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (lower.startsWith('intent://')) {
                        try {
                          final RegExp reg = RegExp(r'scheme=([a-zA-Z0-9]+);');
                          final match = reg.firstMatch(url);
                          if (match != null) {
                            final String scheme = match.group(1)!;
                            final String converted = url
                                .replaceFirst('intent://', '\$scheme://')
                                .split('#Intent')[0];
                            await launchUrl(Uri.parse(converted),
                                mode: LaunchMode.externalApplication);
                            return NavigationDecision.prevent;
                          }
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (!['http', 'https'].contains(uri.scheme) ||
                          lower.contains('wa.me/') ||
                          lower.contains('api.whatsapp.com') ||
                          lower.contains('whatsapp.com/send') ||
                          lower.contains('chat.whatsapp.com') ||
                          lower.contains('t.me/') ||
                          lower.contains('play.google.com/store')) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(_lastUrl));

              _controller = controller;
            }

            @override
            void dispose() {
              _connectivitySub?.cancel();
              _bannerAd?.dispose();
              _interstitialAd?.dispose();
              _rewardedAd?.dispose();
              _flutterTts.stop();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final bool showSplashOrOffline =
                  !_isSplashTimerDone || !_isPageLoaded || !_hasInternet || _hasWebError;

              return UpgradeAlert(
                dialogStyle: UpgradeDialogStyle.material,
                upgrader: Upgrader(
                  messages: UpgraderMessages(code: 'ar'),
                  durationUntilAlertAgain: const Duration(hours: 4),
                ),
                child: PopScope(
                  canPop: false,
                  onPopInvokedWithResult: (didPop, result) async {
                    if (didPop) return;
                    if (await _controller.canGoBack()) {
                      await _controller.goBack();
                    } else {
                      final now = DateTime.now();
                      if (_lastBackPressed == null ||
                          now.difference(_lastBackPressed!) > const Duration(seconds: 2)) {
                        _lastBackPressed = now;
                        if (mounted) {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(
                              content: Text(
                                'اضغط مرة أخرى للخروج من تطبيق فني برو',
                                textAlign: TextAlign.center,
                              ),
                              duration: Duration(seconds: 2),
                            ),
                          );
                        }
                      } else {
                        SystemNavigator.pop();
                      }
                    }
                  },
                  child: Scaffold(
                    resizeToAvoidBottomInset: true,
                    backgroundColor: const Color(0xFF1B3B7B),
                    body: SafeArea(
                      child: Stack(
                        children: [
                          Column(
                            children: [
                              if (_isBannerLoaded && _bannerAd != null)
                                Container(
                                  width: _bannerAd!.size.width.toDouble(),
                                  height: _bannerAd!.size.height.toDouble(),
                                  color: const Color(0xFF1B3B7B),
                                  alignment: Alignment.center,
                                  child: AdWidget(ad: _bannerAd!),
                                ),

                              if (_loadingProgress < 1.0 && !showSplashOrOffline)
                                LinearProgressIndicator(
                                  value: _loadingProgress,
                                  backgroundColor: Colors.transparent,
                                  valueColor:
                                      const AlwaysStoppedAnimation<Color>(Colors.amber),
                                  minHeight: 2.5,
                                ),

                              Expanded(
                                child: WebViewWidget(controller: _controller),
                              ),
                            ],
                          ),

                          if (showSplashOrOffline)
                            Positioned.fill(
                              child: Container(
                                color: const Color(0xFF1B3B7B),
                                child: Stack(
                                  children: [
                                    Positioned.fill(
                                      child: Image.asset(
                                        'assets/splash.png',
                                        fit: BoxFit.contain,
                                        filterQuality: FilterQuality.high,
                                      ),
                                    ),

                                    if (_hasInternet && !_hasWebError)
                                      const Align(
                                        alignment: Alignment(0, 0.75),
                                        child: SizedBox(
                                          width: 30,
                                          height: 30,
                                          child: CircularProgressIndicator(
                                            strokeWidth: 3,
                                            valueColor: AlwaysStoppedAnimation<Color>(Colors.white),
                                          ),
                                        ),
                                      ),

                                    if (!_hasInternet || _hasWebError)
                                      Positioned(
                                        bottom: 30,
                                        left: 24,
                                        right: 24,
                                        child: Container(
                                          padding: const EdgeInsets.all(16),
                                          decoration: BoxDecoration(
                                            color: const Color(0xFF13295B).withOpacity(0.95),
                                            borderRadius: BorderRadius.circular(16),
                                            border: Border.all(
                                              color: Colors.amber.withOpacity(0.5),
                                            ),
                                          ),
                                          child: Column(
                                            mainAxisSize: MainAxisSize.min,
                                            children: [
                                              const Icon(
                                                Icons.wifi_off_rounded,
                                                color: Colors.amber,
                                                size: 34,
                                              ),
                                              const SizedBox(height: 8),
                                              const Text(
                                                'لا يوجد اتصال بالإنترنت',
                                                style: TextStyle(
                                                  color: Colors.white,
                                                  fontSize: 16,
                                                  fontWeight: FontWeight.bold,
                                                ),
                                              ),
                                              const SizedBox(height: 4),
                                              const Text(
                                                'يرجى تفعيل الواي فاي أو بيانات الهاتف، وسيفتح التطبيق تلقائياً فوراً',
                                                textAlign: TextAlign.center,
                                                style: TextStyle(
                                                  color: Colors.white70,
                                                  fontSize: 12.5,
                                                ),
                                              ),
                                              const SizedBox(height: 12),
                                              ElevatedButton.icon(
                                                style: ElevatedButton.styleFrom(
                                                  backgroundColor: Colors.amber,
                                                  foregroundColor: Colors.black87,
                                                ),
                                                onPressed: () {
                                                  setState(() {
                                                    _hasWebError = false;
                                                  });
                                                  _checkInitialConnectivity();
                                                  _controller.loadRequest(Uri.parse(_lastUrl));
                                                },
                                                icon: const Icon(Icons.refresh, size: 18),
                                                label: const Text(
                                                  'إعادة المحاولة الآن',
                                                  style: TextStyle(fontWeight: FontWeight.bold),
                                                ),
                                              ),
                                            ],
                                          ),
                                        ),
                                      ),
                                  ],
                                ),
                              ),
                            ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Signed AAB and APK
        run: |
          cd "$GITHUB_WORKSPACE/app_project"
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload App Bundles
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
