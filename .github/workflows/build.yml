name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project & Add Packages
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter webview_flutter_android url_launcher
          flutter pub add --dev flutter_launcher_icons

      - name: Configure App Icon & Full Splash Image
        run: |
          cd app_project
          mkdir -p assets

          if [ -f "$GITHUB_WORKSPACE/splash.png" ]; then
            cp "$GITHUB_WORKSPACE/splash.png" assets/splash.png
          elif [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/icon.png" assets/splash.png
          fi

          sed -i 's/# assets:/assets:\n    - assets\/splash.png/g' pubspec.yaml

          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            cp "$GITHUB_WORKSPACE/icon.png" icon.png
            cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "icon.png"
            min_sdk_android: 24
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Prepare Signing Key & Verify Alias
        run: |
          KEY_PATH=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \( -name "my-key.jks" -o -name "*.jks" \) | head -n 1)

          if [ -z "$KEY_PATH" ]; then
            echo "ERROR: my-key.jks not found in repository!"
            exit 1
          fi

          cp "$KEY_PATH" "$GITHUB_WORKSPACE/app_project/android/app/upload-keystore.jks"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/app_project/android/app/upload-keystore.jks" -storepass FaniPro2026

      - name: Configure AndroidManifest & Signing in Gradle
        run: |
          cd "$GITHUB_WORKSPACE/app_project"

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                  </intent>
              </queries>

              <application
                  android:label="فني برو"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          ACTUAL_ALIAS=$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass FaniPro2026 | grep "Alias name:" | head -n 1 | awk '{print $3}')
          if [ -z "$ACTUAL_ALIAS" ]; then
            ACTUAL_ALIAS="upload"
          fi

          cat << EOF > android/key.properties
          storePassword=FaniPro2026
          keyPassword=FaniPro2026
          keyAlias=$ACTUAL_ALIAS
          storeFile=upload-keystore.jks
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace "com.pro.ap4016842.skn"
              compileSdk 37
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.pro.ap4016842.skn"
                  minSdkVersion 24
                  targetSdkVersion 37
                  versionCode 13
                  versionName "1.3.0"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

      - name: Write High Performance Flutter WebView Code
        run: |
          cat << 'EOF' > "$GITHUB_WORKSPACE/app_project/lib/main.dart"
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: FaniProScreen(),
            ));
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isSplashVisible = true;
            double _loadingProgress = 0.0;

            @override
            void initState() {
              super.initState();

              Future.delayed(const Duration(seconds: 2), () {
                if (mounted && _isSplashVisible) {
                  setState(() {
                    _isSplashVisible = false;
                  });
                }
              });

              final PlatformWebViewControllerCreationParams params =
                  const PlatformWebViewControllerCreationParams();

              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                (controller.platform as AndroidWebViewController)
                  ..setMediaPlaybackRequiresUserGesture(false);
              }

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF1B3B7B))
                ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {
                      setState(() {
                        _loadingProgress = progress / 100;
                      });
                    },
                    onPageFinished: (String url) {
                      controller.runJavaScript('''
                        (function() {
                          var meta = document.querySelector('meta[name="viewport"]');
                          if (meta) {
                            meta.content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no";
                          }

                          function handleFocus(e) {
                            var target = e.target;
                            if (['INPUT', 'TEXTAREA'].includes(target.tagName) || target.isContentEditable) {
                              setTimeout(function() {
                                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }, 350);
                            }
                          }

                          document.removeEventListener('focusin', handleFocus);
                          document.addEventListener('focusin', handleFocus);

                          if (window.visualViewport) {
                            window.visualViewport.addEventListener('resize', function() {
                              var active = document.activeElement;
                              if (active && (['INPUT', 'TEXTAREA'].includes(active.tagName) || active.isContentEditable)) {
                                active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }
                            });
                          }
                        })();
                      ''');
                    },
                    onNavigationRequest: (NavigationRequest request) async {
                      final String url = request.url;
                      final String lower = url.toLowerCase();
                      final Uri uri = Uri.parse(url);

                      if (lower.startsWith('intent://')) {
                        try {
                          final RegExp reg = RegExp(r'scheme=([a-zA-Z0-9]+);');
                          final match = reg.firstMatch(url);
                          if (match != null) {
                            final String scheme = match.group(1)!;
                            final String converted = url
                                .replaceFirst('intent://', '\$scheme://')
                                .split('#Intent')[0];
                            await launchUrl(Uri.parse(converted), mode: LaunchMode.externalApplication);
                            return NavigationDecision.prevent;
                          }
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (!['http', 'https'].contains(uri.scheme) ||
                          lower.contains('wa.me/') ||
                          lower.contains('api.whatsapp.com') ||
                          lower.contains('whatsapp.com/send') ||
                          lower.contains('chat.whatsapp.com') ||
                          lower.contains('t.me/')) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://hrinnf.blogspot.com/'));

              _controller = controller;
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvoked: (didPop) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  }
                },
                child: Scaffold(
                  resizeToAvoidBottomInset: true,
                  backgroundColor: const Color(0xFF1B3B7B),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),

                        if (_loadingProgress < 1.0 && !_isSplashVisible)
                          LinearProgressIndicator(
                            value: _loadingProgress,
                            backgroundColor: Colors.transparent,
                            valueColor: const AlwaysStoppedAnimation<Color>(Colors.amber),
                            minHeight: 2.5,
                          ),

                        if (_isSplashVisible)
                          Positioned.fill(
                            child: Container(
                              color: const Color(0xFF1B3B7B),
                              child: Stack(
                                fit: StackFit.expand,
                                children: [
                                  Image.asset(
                                    'assets/splash.png',
                                    fit: BoxFit.cover,
                                  ),
                                  const Positioned(
                                    bottom: 60,
                                    left: 0,
                                    right: 0,
                                    child: Center(
                                      child: CircularProgressIndicator(
                                        color: Colors.white,
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Signed AAB and APK
        run: |
          cd "$GITHUB_WORKSPACE/app_project"
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload App Bundles
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
