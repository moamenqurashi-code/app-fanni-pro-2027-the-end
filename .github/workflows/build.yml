name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK for 16KB Page Size
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Flutter (Supports 16KB Page Alignment)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Flutter Project & Add Packages
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter webview_flutter_android url_launcher image_picker permission_handler upgrader
          flutter pub add --dev flutter_launcher_icons

      - name: Configure App Icon & High-Res Splash Image
        run: |
          cd app_project
          mkdir -p assets

          if [ -f "$GITHUB_WORKSPACE/splash.png" ]; then
            cp "$GITHUB_WORKSPACE/splash.png" assets/splash.png
          elif [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/icon.png" assets/splash.png
          fi

          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/icon.png" assets/icon.png
          else
            cp assets/splash.png assets/icon.png
          fi

          sed -i 's/# assets:/assets:\n    - assets\/splash.png\n    - assets\/icon.png/g' pubspec.yaml

          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            cp "$GITHUB_WORKSPACE/icon.png" icon.png
            cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "icon.png"
            min_sdk_android: 24
          EOF
            dart run flutter_launcher_icons
          fi

      - name: Prepare Signing Key & Verify Alias
        run: |
          KEY_PATH=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \( -name "my-key.jks" -o -name "*.jks" \) | head -n 1)

          if [ -z "$KEY_PATH" ]; then
            echo "ERROR: my-key.jks not found in repository!"
            exit 1
          fi

          cp "$KEY_PATH" "$GITHUB_WORKSPACE/app_project/android/app/upload-keystore.jks"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/app_project/android/app/upload-keystore.jks" -storepass FaniPro2026

      - name: Configure AndroidManifest, 16KB Page Size & Signing in Gradle
        run: |
          cd "$GITHUB_WORKSPACE/app_project"

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:replace="android:maxSdkVersion"/>
              <uses-permission android:name="android.permission.CAMERA"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                  </intent>
              </queries>

              <application
                  android:label="فني برو"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true"
                  android:requestLegacyExternalStorage="true"
                  android:extractNativeLibs="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize|stateHidden">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          ACTUAL_ALIAS=$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass FaniPro2026 | grep "Alias name:" | head -n 1 | awk '{print $3}')
          if [ -z "$ACTUAL_ALIAS" ]; then
            ACTUAL_ALIAS="upload"
          fi

          cat << EOF > android/key.properties
          storePassword=FaniPro2026
          keyPassword=FaniPro2026
          keyAlias=$ACTUAL_ALIAS
          storeFile=upload-keystore.jks
          EOF

          sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.7.2"/' android/settings.gradle || true
          sed -i 's/gradle-.*-all.zip/gradle-8.9-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace "com.pro.ap4016842.skn"
              compileSdk 36
              ndkVersion "27.0.12077973"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.pro.ap4016842.skn"
                  minSdkVersion 24
                  targetSdkVersion 36
                  versionCode 15
                  versionName "1.5.0"
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = false
                  }
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

      - name: Write High Performance Flutter WebView Code with Auto Update
        run: |
          cat << 'EOF' > "$GITHUB_WORKSPACE/app_project/lib/main.dart"
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:upgrader/upgrader.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(
              MaterialApp(
                debugShowCheckedModeBanner: false,
                builder: (context, child) {
                  return MediaQuery(
                    data: MediaQuery.of(context).copyWith(
                      textScaler: const TextScaler.linear(1.0),
                    ),
                    child: child!,
                  );
                },
                home: const FaniProScreen(),
              ),
            );
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isSplashTimerDone = false;
            bool _isPageLoaded = false;
            bool _hasInternet = true;
            bool _hasWebError = false;
            double _loadingProgress = 0.0;
            Timer? _networkTimer;
            String _lastUrl = 'https://hrinnf.blogspot.com/';

            @override
            void initState() {
              super.initState();
              _requestAppPermissions();
              _initWebView();
              _startSplashAndNetworkGuard();
            }

            Future<void> _requestAppPermissions() async {
              try {
                await [
                  Permission.photos,
                  Permission.storage,
                  Permission.notification,
                ].request();
              } catch (_) {}
            }

            void _startSplashAndNetworkGuard() {
              Future.delayed(const Duration(seconds: 4), () {
                if (mounted) {
                  setState(() {
                    _isSplashTimerDone = true;
                  });
                }
              });

              _checkInternetConnection();
              _networkTimer = Timer.periodic(const Duration(seconds: 2), (_) {
                _checkInternetConnection();
              });
            }

            Future<void> _checkInternetConnection() async {
              try {
                final result = await InternetAddress.lookup('google.com')
                    .timeout(const Duration(seconds: 2));
                final bool connected =
                    result.isNotEmpty && result[0].rawAddress.isNotEmpty;

                if (mounted) {
                  if (connected && (!_hasInternet || _hasWebError)) {
                    setState(() {
                      _hasInternet = true;
                      _hasWebError = false;
                    });
                    _controller.loadRequest(Uri.parse(_lastUrl));
                  } else if (!connected && _hasInternet) {
                    setState(() {
                      _hasInternet = false;
                    });
                  }
                }
              } catch (_) {
                if (mounted && _hasInternet) {
                  setState(() {
                    _hasInternet = false;
                  });
                }
              }
            }

            void _initWebView() {
              const PlatformWebViewControllerCreationParams params =
                  PlatformWebViewControllerCreationParams();

              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                final androidController =
                    controller.platform as AndroidWebViewController;
                androidController.setMediaPlaybackRequiresUserGesture(false);
                androidController.setTextZoom(100);

                androidController.setOnShowFileSelector((FileSelectorParams params) async {
                  try {
                    final ImagePicker picker = ImagePicker();
                    final XFile? image = await picker.pickImage(
                      source: ImageSource.gallery,
                      imageQuality: 80,
                    );
                    if (image != null) {
                      return [File(image.path).uri.toString()];
                    }
                  } catch (_) {}
                  return [];
                });
              }

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF1B3B7B))
                ..setUserAgent(
                    'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {
                      if (mounted) {
                        setState(() {
                          _loadingProgress = progress / 100;
                        });
                      }
                    },
                    onPageStarted: (String url) {
                      if (url.startsWith('http')) {
                        _lastUrl = url;
                      }
                    },
                    onPageFinished: (String url) {
                      if (mounted && !_hasWebError) {
                        setState(() {
                          _isPageLoaded = true;
                        });
                      }

                      controller.runJavaScript('''
                        (function() {
                          var meta = document.querySelector('meta[name="viewport"]');
                          if (meta) {
                            meta.content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no";
                          }
                          document.documentElement.style.webkitTextSizeAdjust = '100%';

                          function handleFocus(e) {
                            var target = e.target;
                            if (['INPUT', 'TEXTAREA'].includes(target.tagName) || target.isContentEditable) {
                              setTimeout(function() {
                                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              }, 350);
                            }
                          }

                          document.removeEventListener('focusin', handleFocus);
                          document.addEventListener('focusin', handleFocus);
                        })();
                      ''');
                    },
                    onWebResourceError: (WebResourceError error) {
                      if (error.isForMainFrame ?? true) {
                        if (mounted) {
                          setState(() {
                            _hasWebError = true;
                            _hasInternet = false;
                          });
                        }
                      }
                    },
                    onNavigationRequest: (NavigationRequest request) async {
                      final String url = request.url;
                      final String lower = url.toLowerCase();
                      final Uri uri = Uri.parse(url);

                      final bool isDownloadFile = lower.endsWith('.pdf') ||
                          lower.endsWith('.doc') ||
                          lower.endsWith('.docx') ||
                          lower.endsWith('.zip') ||
                          lower.endsWith('.rar') ||
                          lower.endsWith('.apk') ||
                          lower.contains('drive.google.com/uc?') ||
                          lower.contains('drive.usercontent.google.com/download') ||
                          lower.contains('mediafire.com/file/');

                      if (isDownloadFile) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (lower.startsWith('intent://')) {
                        try {
                          final RegExp reg = RegExp(r'scheme=([a-zA-Z0-9]+);');
                          final match = reg.firstMatch(url);
                          if (match != null) {
                            final String scheme = match.group(1)!;
                            final String converted = url
                                .replaceFirst('intent://', '\$scheme://')
                                .split('#Intent')[0];
                            await launchUrl(Uri.parse(converted),
                                mode: LaunchMode.externalApplication);
                            return NavigationDecision.prevent;
                          }
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      if (!['http', 'https'].contains(uri.scheme) ||
                          lower.contains('wa.me/') ||
                          lower.contains('api.whatsapp.com') ||
                          lower.contains('whatsapp.com/send') ||
                          lower.contains('chat.whatsapp.com') ||
                          lower.contains('t.me/')) {
                        try {
                          await launchUrl(uri, mode: LaunchMode.externalApplication);
                        } catch (_) {}
                        return NavigationDecision.prevent;
                      }

                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(_lastUrl));

              _controller = controller;
            }

            @override
            void dispose() {
              _networkTimer?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final bool showSplashOrOffline =
                  !_isSplashTimerDone || !_isPageLoaded || !_hasInternet || _hasWebError;

              // تفعيل أداة فحص التحديثات التلقائية من متجر جوجل بلاي
              return UpgradeAlert(
                upgrader: Upgrader(
                  messages: UpgraderMessages(code: 'ar'),
                  dialogStyle: UpgradeDialogStyle.material,
                  durationUntilAlertAgain: const Duration(hours: 4),
                ),
                child: PopScope(
                  canPop: false,
                  onPopInvokedWithResult: (didPop, result) async {
                    if (didPop) return;
                    if (await _controller.canGoBack()) {
                      await _controller.goBack();
                    }
                  },
                  child: Scaffold(
                    resizeToAvoidBottomInset: true,
                    backgroundColor: const Color(0xFF1B3B7B),
                    body: SafeArea(
                      child: Stack(
                        children: [
                          WebViewWidget(controller: _controller),

                          if (_loadingProgress < 1.0 && !showSplashOrOffline)
                            LinearProgressIndicator(
                              value: _loadingProgress,
                              backgroundColor: Colors.transparent,
                              valueColor:
                                  const AlwaysStoppedAnimation<Color>(Colors.amber),
                              minHeight: 2.5,
                            ),

                          if (showSplashOrOffline)
                            Positioned.fill(
                              child: Container(
                                decoration: const BoxDecoration(
                                  gradient: LinearGradient(
                                    begin: Alignment.topCenter,
                                    end: Alignment.bottomCenter,
                                    colors: [
                                      Color(0xFF234696),
                                      Color(0xFF13295B),
                                    ],
                                  ),
                                ),
                                child: Column(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  children: [
                                    const Spacer(flex: 3),
                                    Container(
                                      width: 135,
                                      height: 135,
                                      decoration: BoxDecoration(
                                        borderRadius: BorderRadius.circular(28),
                                        boxShadow: [
                                          BoxShadow(
                                            color: Colors.black.withOpacity(0.28),
                                            blurRadius: 18,
                                            offset: const Offset(0, 8),
                                          ),
                                        ],
                                      ),
                                      child: ClipRRect(
                                        borderRadius: BorderRadius.circular(28),
                                        child: Image.asset(
                                          'assets/splash.png',
                                          fit: BoxFit.contain,
                                          filterQuality: FilterQuality.high,
                                          isAntiAlias: true,
                                        ),
                                      ),
                                    ),
                                    const SizedBox(height: 18),
                                    const Text(
                                      'تطبيق فني برو',
                                      style: TextStyle(
                                        color: Colors.white,
                                        fontSize: 22,
                                        fontWeight: FontWeight.bold,
                                      ),
                                    ),
                                    const SizedBox(height: 6),
                                    const Text(
                                      'مساعد طالب التعليم الفني',
                                      style: TextStyle(
                                        color: Colors.white70,
                                        fontSize: 14,
                                      ),
                                    ),
                                    const Spacer(flex: 2),

                                    if (_hasInternet && !_hasWebError)
                                      const Column(
                                        children: [
                                          CircularProgressIndicator(
                                            color: Colors.amber,
                                            strokeWidth: 3,
                                          ),
                                          SizedBox(height: 14),
                                          Text(
                                            'جاري تجهيز المنصة...',
                                            style: TextStyle(
                                              color: Colors.white70,
                                              fontSize: 13,
                                            ),
                                          ),
                                        ],
                                      )
                                    else
                                      Container(
                                        margin: const EdgeInsets.symmetric(horizontal: 28),
                                        padding: const EdgeInsets.all(16),
                                        decoration: BoxDecoration(
                                          color: Colors.white.withOpacity(0.12),
                                          borderRadius: BorderRadius.circular(16),
                                          border: Border.all(
                                            color: Colors.amber.withOpacity(0.5),
                                          ),
                                        ),
                                        child: Column(
                                          children: [
                                            const Icon(
                                              Icons.wifi_off_rounded,
                                              color: Colors.amber,
                                              size: 36,
                                            ),
                                            const SizedBox(height: 8),
                                            const Text(
                                              'لا يوجد اتصال بالإنترنت',
                                              style: TextStyle(
                                                color: Colors.white,
                                                fontSize: 16,
                                                fontWeight: FontWeight.bold,
                                              ),
                                            ),
                                            const SizedBox(height: 4),
                                            const Text(
                                              'يرجى تفعيل الواي فاي أو بيانات الهاتف، وسيفتح التطبيق تلقائياً فوراً',
                                              textAlign: TextAlign.center,
                                              style: TextStyle(
                                                color: Colors.white70,
                                                fontSize: 12.5,
                                              ),
                                            ),
                                            const SizedBox(height: 12),
                                            ElevatedButton.icon(
                                              style: ElevatedButton.styleFrom(
                                                backgroundColor: Colors.amber,
                                                foregroundColor: Colors.black87,
                                                shape: RoundedRectangleBorder(
                                                  borderRadius: BorderRadius.circular(10),
                                                ),
                                              ),
                                              onPressed: () {
                                                _checkInternetConnection();
                                                _controller.loadRequest(Uri.parse(_lastUrl));
                                              },
                                              icon: const Icon(Icons.refresh, size: 18),
                                              label: const Text(
                                                'إعادة المحاولة الآن',
                                                style: TextStyle(fontWeight: FontWeight.bold),
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                    const SizedBox(height: 45),
                                  ],
                                ),
                              ),
                            ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Signed AAB and APK
        run: |
          cd "$GITHUB_WORKSPACE/app_project"
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload App Bundles
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
